[build]
  publish = "."
  functions = "netlify/functions"

# HTML always revalidates so new deploys show immediately (no stale CDN/browser cache)
[[headers]]
  for = "/*"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

# images can be cached
[[headers]]
  for = "/img/*"
  [headers.values]
    Cache-Control = "public, max-age=86400"
